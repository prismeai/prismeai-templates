slug: generateTaglines
name: Generate taglines
description: Calls the LLM App for three taglines based on a product description. Callable as an endpoint (webhook / Play button / execute_automation).
arguments:
  description:
    type: string
    title: Product description
    description: A one-line description of the product to advertise. The LLM uses this as the source material for the taglines.
when:
  endpoint: true
do:
  - LLM.chatCompletion:
      messages:
        - role: system
          content: |-
            You are a senior copywriter. Given a product description, return
            exactly three taglines. Each tagline on its own line, numbered
            "1.", "2.", "3.". No preamble, no explanation. Each tagline is at
            most ten words, punchy and memorable. Avoid buzzwords like
            "innovative", "cutting-edge", "next-generation".
        - role: user
          content: '{{description}}'
      temperature: 0.9
      max_tokens: 200
      output: completion
output:
  taglines: '{{completion.choices[0].message.content}}'
