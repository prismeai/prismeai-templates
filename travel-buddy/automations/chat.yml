name: chat
description: Listens for the page's "ask" event, sends the user's question to the Travel Buddy agent, saves the reply in session, and emits "replyReady" so the page refreshes.
arguments:
  payload:
    type: object
    properties:
      question:
        type: string
when:
  events:
    - ask
do:
  - conditions:
      '!{{config.agentId}}':
        - set:
            name: session.reply
            value: Set the agent ID in workspace config first. Run setupAgent if needed.
        - emit:
            event: replyReady
        - break: {}
  - Agents.sendMessage:
      agent_id: '{{config.agentId}}'
      message:
        parts:
          - type: text
            text: '{{payload.question}}'
      output: response
  - set:
      name: session.reply
      value: '{{response.task.output.messages[0].parts[0].text}}'
  - emit:
      event: replyReady
output: ok
