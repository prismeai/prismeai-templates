slug: chat
name: Chat with Travel Buddy
description: Sends a question to the Travel Buddy agent and returns its reply. Callable as an endpoint (webhook / Play button / execute_automation). Requires config.agentId to be set — run setupAgent first.
arguments:
  question:
    type: string
    title: Question
    description: The user's question for Travel Buddy — a destination, a vibe, a vague travel dream.
when:
  endpoint: true
do:
  - conditions:
      '!{{config.agentId}}':
        - set:
            name: reply
            value: ''
        - set:
            name: error
            value: Set the agent ID in workspace config first. Run setupAgent if needed.
        - break: {}
      default:
        - Agents.sendMessage:
            agent_id: '{{config.agentId}}'
            message:
              parts:
                - type: text
                  text: '{{question}}'
            output: response
        - set:
            name: reply
            value: '{{response.task.output.messages[0].parts[0].text}}'
output:
  reply: '{{reply}}'
  error: '{{error}}'
