slug: index
name: Travel Buddy
description: Ask Travel Buddy where to go, what to eat, or what to skip.
automation: loadPage
updateOn: replyReady
blocks:
  - slug: RichText
    css: ':block { padding: 24px 24px 0; max-width: 720px; margin: 0 auto; }'
    content: |-
      # Travel Buddy

      Tell your buddy where you're going (or where you wish you were). Get a short,
      friendly suggestion back.
  - slug: Form
    css: ':block { padding: 0 24px; max-width: 720px; margin: 0 auto; }'
    schema:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          title: Your question
          ui:widget: textarea
    submitLabel: Ask
    disableSubmitDelay: 6000
    onSubmit: ask
  - slug: RichText
    css: |-
      :block {
        padding: 16px 24px;
        max-width: 720px;
        margin: 16px auto;
        background: #f6f8fa;
        border-radius: 8px;
        white-space: pre-wrap;
        line-height: 1.55;
        min-height: 80px;
      }
    content: '{{reply}}'
colorScheme: auto
